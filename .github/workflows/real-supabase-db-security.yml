name: Real Supabase DB Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    name: Real Supabase DB Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Start fresh ephemeral Postgres
        run: |
          set -euo pipefail
          supabase --version
          supabase db start
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker exec "$db_container" psql -U postgres -d postgres -Atc 'show server_version'

      - name: Run real migration, RLS, ownership, and RBAC tests
        run: supabase test db

      - name: Stop ephemeral Postgres
        if: always()
        run: supabase stop --no-backup
